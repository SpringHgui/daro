name: macOS 冒烟测试（手动）

# 目的：回答「这个程序到底能不能在 mac 上跑起来」。
# 从 GitHub Releases 下载已发布的 zip（macOS 没有安装步骤，解压即 .app），
# 跑两轮：
#   1) 给 .app 打上 com.apple.quarantine，模拟用户从浏览器下载后双击 ——
#      预期被 Gatekeeper 拦，截图留证；这一步被拦不算失败。
#   2) xattr -cr 放行后再开一次 —— 进程活下来才算程序本身没问题。
# 不推 tag、不发版；只上传截图/日志/崩溃报告到 artifact，并写进 job summary。
#
# 注意：GitHub-hosted macOS runner 的 screencapture 偶尔拍到黑屏或桌面，
# 这是 runner 的 GUI 会话限制，不代表应用有问题；进程存活判定才是硬指标。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要测的版本号（如 1.0.11；留空 = 最新发布版）'
        required: false
        type: string
        default: ''
      arch:
        description: '测试架构（both = 同时跑 arm64 和 x64）'
        required: true
        type: choice
        default: both
        options:
          - both
          - arm64
          - x64
      source:
        description: '测已发布版，还是当前分支源码现编（验修复用）'
        required: true
        type: choice
        default: release
        options:
          - release
          - source

permissions:
  contents: read

jobs:
  smoke:
    name: macOS ${{ matrix.arch }} 冒烟
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      # job 级 env 不能用 runner 上下文（GitHub Actions 语法限制），
      # github.workspace 在这里可用，mkdir -p 会保证目录存在。
      REPORT_DIR: ${{ github.workspace }}/daro-smoke-report
    strategy:
      fail-fast: false
      # job 级 if 同样不能用 matrix 上下文，改为按 inputs.arch 动态生成
      # matrix：只选一个架构时就只起一个 runner，both 才起两个。
      matrix:
        include: >-
          ${{ fromJSON(inputs.arch == 'x64' && '[{"arch":"x64","runner":"macos-15-intel"}]' || inputs.arch == 'arm64' && '[{"arch":"arm64","runner":"macos-latest"}]' || '[{"arch":"arm64","runner":"macos-latest"},{"arch":"x64","runner":"macos-15-intel"}]') }}

    steps:
      - uses: actions/checkout@v4

      - name: 准备被测程序（下载发布版 / 当前源码现编）
        shell: bash
        working-directory: daro-rs
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR/download" "$REPORT_DIR/extracted"
          : > "$REPORT_DIR/report.txt"

          arch="${{ matrix.arch }}"
          repo="SpringHgui/daro"
          source_mode="${{ inputs.source }}"
          version="${{ inputs.version }}"
          version="${version#v}"

          {
            echo "## macOS ${arch} 冒烟报告"
            echo
            echo "- 时间：$(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- runner：${{ matrix.runner }}（$(uname -m) / $(sw_vers -productVersion)）"
            echo "- 被测来源：${source_mode}"
          } | tee -a "$REPORT_DIR/report.txt"

          if [[ "$source_mode" == "source" ]]; then
            version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)-dev"
            cargo build --release --locked --bin daro-rs --bin daro-mcpd
            bash packaging/macos/bundle-app.sh --skip-build
            zip="$(find dist -maxdepth 1 -name 'daro-rs-*-macos-*.zip' | head -1)"
            echo "- 构建产物：${zip}" | tee -a "$REPORT_DIR/report.txt"
            unzip -q "$zip" -d "$REPORT_DIR/extracted"
          else
            if [[ -n "$version" ]]; then
              tag="daro-rs-v${version}"
            else
              tag="$(gh release view --repo "$repo" --json tagName --jq .tagName)"
              version="${tag#daro-rs-v}"
            fi
            pattern="daro-rs-${version}-macos-${arch}.zip"
            echo "- release tag：${tag}" | tee -a "$REPORT_DIR/report.txt"
            echo "- 下载资产：${pattern}" | tee -a "$REPORT_DIR/report.txt"
            gh release download "$tag" --repo "$repo" \
              --pattern "$pattern" --dir "$REPORT_DIR/download" --clobber
            unzip -q "$REPORT_DIR/download/$pattern" -d "$REPORT_DIR/extracted"
          fi

          app="$(find "$REPORT_DIR/extracted" -type d -name 'daro-rs.app' | head -1)"
          if [[ -z "$app" ]]; then
            echo "❌ 找不到 daro-rs.app" | tee -a "$REPORT_DIR/report.txt"
            exit 1
          fi
          echo "$app" > "$REPORT_DIR/app_path"
          echo "$version" > "$REPORT_DIR/version"
          echo "✅ 被测程序就位：${app}" | tee -a "$REPORT_DIR/report.txt"

      - name: 直跑主程序（绕过 LaunchServices / Gatekeeper，抓 stdout/stderr）
        shell: bash
        run: |
          set -uo pipefail
          app="$(cat "$REPORT_DIR/app_path")"
          bin="$app/Contents/MacOS/daro-rs"
          {
            echo
            echo "### 直接运行主程序二进制（不经 open / Gatekeeper）"
          } >> "$REPORT_DIR/report.txt"

          # 前台进程直接拉起，不经 LaunchServices；能活着就说明二进制本身
          # 可运行，问题只在签名/公证；起不来则 stderr 会给出真实原因。
          "$bin" >"$REPORT_DIR/direct.out" 2>"$REPORT_DIR/direct.err" &
          pid=$!
          sleep 10
          alive="no"
          if kill -0 "$pid" 2>/dev/null; then
            alive="yes"
          fi

          {
            echo "- PID：${pid}"
            echo "- 10 秒后进程存活：${alive}"
            echo "- stdout："
            cat "$REPORT_DIR/direct.out" 2>/dev/null || true
            echo "- stderr："
            cat "$REPORT_DIR/direct.err" 2>/dev/null || true
            if [[ "$alive" == "yes" ]]; then
              echo "- 结论：✅ 二进制本身能在 macOS 上运行，问题只在 Gatekeeper/签名。"
              echo "ok" > "$REPORT_DIR/direct_result"
            else
              echo "- 结论：❌ 直跑也起不来，是程序/运行时问题，不是签名。"
              echo "fail" > "$REPORT_DIR/direct_result"
            fi
          } >> "$REPORT_DIR/report.txt" 2>&1

          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          sleep 2

      - name: 第一轮：放行后启动（验证程序本身能否运行）
        shell: bash
        run: |
          set -uo pipefail
          app="$(cat "$REPORT_DIR/app_path")"

          # open 遇到系统对话框会一直等，CI 里没人点，必须限时；124 = 超时。
          # 进程检测必须用 -x 精确匹配进程名：之前用 -f 全命令行会匹配到
          # open 命令自身（命令行里含完整路径），造出「进程存活」的假阳性。
          timed() {
            local secs="$1"; shift
            "$@" &
            local pid=$! i=0
            while [[ $i -lt $secs ]] && kill -0 "$pid" 2>/dev/null; do
              sleep 1
              i=$((i + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              return 124
            fi
            wait "$pid"
          }

          # 放行轮放前面：此时没有残留的 Gatekeeper 对话框，判定最干净。
          # 反过来先跑带 quarantine 那轮的话，对话框会留在屏幕上，
          # 后续 open 直接复用它，清了 quarantine 也开不起来。
          xattr -cr "$app"
          {
            echo
            echo "### 第一轮：清除隔离属性后启动（程序本身能否跑）"
          } >> "$REPORT_DIR/report.txt"

          set +e
          timed 15 open "$app" >"$REPORT_DIR/open-clean.out" 2>"$REPORT_DIR/open-clean.err"
          open_rc=$?
          set -e

          # 启动需要时间；等 8 秒再看进程，避免把启动慢误判成崩溃。
          sleep 8
          alive="no"
          if pgrep -x daro-rs >/dev/null; then
            alive="yes"
          fi
          timed 15 screencapture -x "$REPORT_DIR/01-opened.png" || true

          {
            echo "- open 退出码：${open_rc}$([[ "$open_rc" == 124 ]] && echo '（15 秒未返回）')"
            echo "- stderr：$(cat "$REPORT_DIR/open-clean.err")"
            echo "- 进程列表："
            pgrep -ax daro-rs || echo "  (无)"
            echo "- 进程存活：${alive}"
          } >> "$REPORT_DIR/report.txt"

          if [[ "$alive" == "yes" ]]; then
            echo "- 结论：✅ 程序能在这台 macOS 上启动并保持运行。" >> "$REPORT_DIR/report.txt"
            echo "ok" > "$REPORT_DIR/result"
          else
            echo "- 结论：❌ 放行后进程仍未存活，程序本身可能启动即崩溃。见下方崩溃报告。" >> "$REPORT_DIR/report.txt"
            echo "fail" > "$REPORT_DIR/result"
          fi

          # 清干净再进第二轮，否则已运行实例会让 open 复用，测不到拦截。
          pkill -x daro-rs 2>/dev/null || true
          sleep 3

      - name: 第二轮：模拟用户下载后首次打开（带隔离属性）
        shell: bash
        run: |
          set -uo pipefail
          app="$(cat "$REPORT_DIR/app_path")"

          timed() {
            local secs="$1"; shift
            "$@" &
            local pid=$! i=0
            while [[ $i -lt $secs ]] && kill -0 "$pid" 2>/dev/null; do
              sleep 1
              i=$((i + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              return 124
            fi
            wait "$pid"
          }

          # 真实模拟浏览器下载留下的隔离属性；gh 在 CI 里下载不会自动打。
          xattr -w com.apple.quarantine \
            "0081;$(date +%s);Safari;00000000-0000-0000-0000-000000000000" "$app"

          {
            echo
            echo "### 第二轮：带 quarantine 打开（Gatekeeper 拦截留证）"
          } >> "$REPORT_DIR/report.txt"

          set +e
          timed 12 open "$app" >"$REPORT_DIR/open-quarantine.out" 2>"$REPORT_DIR/open-quarantine.err"
          open_rc=$?
          set -e
          sleep 3

          alive="no"
          if pgrep -x daro-rs >/dev/null; then
            alive="yes"
          fi
          timed 15 screencapture -x "$REPORT_DIR/02-quarantine.png" || true

          {
            echo "- open 退出码：${open_rc}$([[ "$open_rc" == 124 ]] && echo '（12 秒未返回，Gatekeeper 对话框在等人工点击）')"
            echo "- stderr：$(cat "$REPORT_DIR/open-quarantine.err")"
            echo "- 进程存活：${alive}"
            if [[ "$alive" == "no" ]]; then
              echo "- 结论：首次打开被系统拦下（见截图的 Gatekeeper 提示）。这是预期现象，不代表程序坏。"
            else
              echo "- 结论：这次带隔离属性也启动了。"
            fi
          } >> "$REPORT_DIR/report.txt"

          pkill -x daro-rs 2>/dev/null || true

      - name: 收集系统诊断
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          app="$(cat "$REPORT_DIR/app_path" 2>/dev/null || true)"
          {
            echo
            echo "### 签名与 Gatekeeper 评估"
            if [[ -n "$app" ]]; then
              echo "-- spctl --"
              spctl -a -vvv -t exec "$app" 2>&1 || true
              echo "-- codesign --verify --"
              codesign --verify --strict --verbose=2 "$app" 2>&1 || true
              echo "-- codesign -dv --"
              codesign -dv --verbose=4 "$app" 2>&1 || true
              echo "-- bundle 内文件 --"
              find "$app" -type f | head -40
            fi

            echo
            echo "### 崩溃报告（daro-rs 相关）"
            found=0
            for f in "$HOME"/Library/Logs/DiagnosticReports/daro-rs*.crash; do
              [[ -f "$f" ]] || continue
              found=1
              echo "-- $f --"
              head -60 "$f"
            done
            [[ "$found" == 1 ]] || echo "(无崩溃报告)"
          } >> "$REPORT_DIR/report.txt" 2>&1

      - name: 上传截图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daro-smoke-${{ matrix.arch }}
          # 只传报告本身，别把 30MB 下载包和 80MB 解压目录一起塞进 artifact。
          path: |
            ${{ github.workspace }}/daro-smoke-report/*.txt
            ${{ github.workspace }}/daro-smoke-report/*.png
            ${{ github.workspace }}/daro-smoke-report/*.out
            ${{ github.workspace }}/daro-smoke-report/*.err
            ${{ github.workspace }}/daro-smoke-report/result
          if-no-files-found: warn
          retention-days: 14

      - name: 写入 Job Summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## macOS ${{ matrix.arch }} 冒烟测试"
            echo
            echo '```text'
            cat "$REPORT_DIR/report.txt" 2>/dev/null || echo "(无报告)"
            echo '```'
            echo
            echo "截图与完整日志见本 run 的 Artifacts：**daro-smoke-${{ matrix.arch }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 判定结果
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # 硬指标是「直跑二进制能存活」：它区分了「签名被 Gatekeeper 拦」
          # 和「程序本身在 macOS 上起不来」。open 两轮只留现场证据。
          if [[ "$(cat "$REPORT_DIR/direct_result" 2>/dev/null || true)" == "ok" ]]; then
            echo "程序二进制验证通过；Gatekeeper 状况见报告"
          else
            echo "程序二进制直跑失败，请看报告里的 stdout/stderr 与 artifact" >&2
            exit 1
          fi
