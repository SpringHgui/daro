name: Release

# 自动为 daro 构建 Windows / macOS / Linux 安装包并（打 tag 时）发布到 GitHub Releases。
#
# 触发方式：
#   1) 打 tag `v*`（如 v0.2.0）→ 构建三平台安装包 + 建一个 Draft Release 并上传产物
#   2) 手动 workflow_dispatch → 只构建并上传 artifacts（不发 Release），用于试跑
#
# 版本号的唯一数据源仍是 pubspec.yaml 的 `version:`（与本地打包脚本一致）。
# 安装包文件名里的 x.y.z 从 pubspec 读取；tag 只用于决定是否发布 Release。
#
# 说明：
#   - base-ui-flutter 是 git submodule，所有 job 用 `submodules: recursive` 拉取。
#   - Windows 一次 flutter build 出两个产物：Inno Setup 安装包 .exe 与绿色版 .zip
#     （build_installer.bat -All；绿色版由 installer/windows/portable_zip.ps1 打包，
#      解压得到一个带版本号的顶层目录，免安装、免管理员权限、不写注册表）。
#   - 另有独立 job build-windows-msix：产出上架 Microsoft Store 用的 .msix（未签名，
#     商店入库时重签）。artifact 名 msix-store 不匹配 daro-* 通配，故不进 GitHub Release，
#     仅供从 Actions 运行页下载后提交 Partner Center。详见 installer/windows/msix/README.md。
#   - pubspec.lock 未纳入版本控制，CI 每次 `flutter pub get` 现解析。
#   - dart_odbc / mysql_client / sqlite3 为运行期加载系统库，编译期跨平台无碍；
#     目标机需自行安装 ODBC / MySQL 客户端库才能用对应引擎（与 README 描述一致）。
#   - macOS 未做开发者证书签名与公证，产物仅 ad-hoc 签名，用户首启需右键“打开”。
#   - Release 正文（提交清单 + 关联 PR + Full Changelog）由 tool/gen_release_notes.py
#     生成，本地可用 `python tool/gen_release_notes.py --tag v0.3.1 --no-pr` 预览。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本机 .metadata 记录的 stable 版本对齐，避免 CI 与本地行为漂移。
  FLUTTER_VERSION: "3.47.0"

jobs:
  meta:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          v="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')"
          if [ -z "$v" ]; then echo "pubspec.yaml 未找到 version:"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "解析到版本号: $v"

  build-windows:
    name: Windows x64 安装包 + 绿色版
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: 依赖解析
        run: flutter pub get

      - name: 构建 Windows Release
        run: flutter build windows --release

      # -All = 一次构建出两个产物，避免为了绿色版再跑一遍 flutter build：
      #   dist\daro-<ver>-windows-x64.exe            （Inno 安装包）
      #   dist\daro-<ver>-windows-x64-portable.zip   （绿色版：解压即用，免安装免管理员）
      # 脚本侧的检查/命名规范与本地完全一致。
      - name: 打包安装包 + 绿色版（复用本地脚本）
        shell: cmd
        run: installer\windows\build_installer.bat -SkipBuild -Arch x64 -NoPause -All

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "daro-*windows-*.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "dist 下未找到 daro-<ver>-windows-<arch>.exe"; exit 1 }
          $zip = Get-ChildItem -Path dist -Filter "daro-*windows-*-portable.zip" -ErrorAction SilentlyContinue
          if (-not $zip) { Write-Error "dist 下未找到 daro-<ver>-windows-<arch>-portable.zip"; exit 1 }
          @($exe) + @($zip) | ForEach-Object { "打包完成: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - uses: actions/upload-artifact@v4
        with:
          name: daro-windows-x64
          path: |
            dist/daro-*windows-*.exe
            dist/daro-*windows-*-portable.zip
          if-no-files-found: error

  build-windows-msix:
    name: Windows x64 MSIX（Microsoft Store 包）
    needs: meta
    runs-on: windows-latest
    # 产出上架 Microsoft Store 用的 .msix。这里**不签名**——商店入库时会用微软证书
    # 重签（Store signing），个人开发者无需购买代码签名证书。清单里已声明
    # unvirtualizedResources + FileSystemWriteVirtualization=disabled，让配置落到真实
    # %APPDATA%\com.example\daro，与 GitHub/绿色版共用、卸载不清除（见 installer/windows/msix/README.md）。
    # 该产物不进 GitHub Release（artifact 名不匹配 daro-* 通配），仅供下载后提交 Partner Center。
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: 依赖解析
        run: flutter pub get

      - name: 构建 Windows Release
        run: flutter build windows --release

      # build/ 未入库，MSIX 打包器依赖 build\ico\256.png 作图标母图——先跑生成用例。
      - name: 生成图标母图 build/ico/*.png
        run: flutter test test/app_icon_test.dart

      - name: 打包 MSIX（未签名，商店重签）
        shell: pwsh
        run: |
          & "${{ github.workspace }}\installer\windows\msix\build_msix.ps1" `
            -Source "build\windows\x64\runner\Release" `
            -Version "${{ needs.meta.outputs.version }}" `
            -Publisher "CN=daro" `
            -PackageName "com.example.daro"
          $msix = Get-ChildItem -Path dist -Filter "daro-*windows-*.msix" -ErrorAction SilentlyContinue
          if (-not $msix) { Write-Error "dist 下未找到 .msix"; exit 1 }
          "打包完成: $($msix.Name) ($([math]::Round($msix.Length/1MB,1)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: dist/daro-*windows-*.msix
          if-no-files-found: error

  build-macos:
    name: macOS universal 安装包
    needs: meta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: 依赖解析
        run: flutter pub get

      # 先做一次标准构建：完成 CocoaPods 安装 + 生成 Flutter ephemeral 配置。
      # 之后再用 xcodebuild 追加多架构，避免 --config-only 漏装 Pods 导致链接失败。
      - name: 初始化 macOS 构建（pod install + Flutter 配置）
        run: flutter build macos --release

      - name: 构建 universal（x86_64 + arm64）
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath build/macos/dd \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 dmg + zip
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: bash installer/macos/make_dmg.sh "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: daro-macos-universal
          path: release/daro-*macos*
          if-no-files-found: error

  build-linux:
    name: Linux x64 安装包
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装系统依赖（GTK / 打包工具 / 图标转换）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgtk-3-dev pkg-config \
            imagemagick libsqlite3-0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: 启用 Linux 桌面
        run: |
          flutter config --enable-linux-desktop
          flutter --version

      - name: 依赖解析
        run: flutter pub get

      - name: 构建 Linux Release
        run: flutter build linux --release

      - name: 打包 deb + tar.xz
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: bash installer/linux/package_linux.sh "$VER"

      - uses: actions/upload-artifact@v4
        with:
          name: daro-linux-x64
          path: release/daro-*linux*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [meta, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      # 生成变更说明要读「上一个 tag → 当前 tag」的完整提交历史，浅克隆拿不到。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release 正文由脚本生成：全部提交（按 Conventional Commits 分类）+ 关联 PR
      # + Full Changelog 链接。不再用 action 的 generate_release_notes——它只统计
      # 经 PR 合入的变更，本仓库直接推 master 的提交全会漏掉。
      - name: 生成 Release 正文（提交 + PR）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tool/gen_release_notes.py \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --output release_body.md
          echo "----- release_body.md -----"
          cat release_body.md

      - name: 下载全部平台的产物
        uses: actions/download-artifact@v4
        with:
          pattern: daro-*
          path: artifacts
          merge-multiple: true

      - name: 列出待上传文件
        run: ls -R artifacts

      - name: 创建 Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: daro ${{ needs.meta.outputs.version }}
          body_path: release_body.md
          draft: true
          prerelease: false
          files: artifacts/*
