[package]
name = "daro-rs"
version = "0.0.1"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
quick-xml = "0.37"
anyhow = "1"
lsp-types = { version = "0.97", features = ["proposed"] }
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
rfd = "0.17.2"
rusqlite = { version = "0.41.1", features = ["bundled", "column_decltype"] }
postgres = { version = "0.19", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# headless 测试台（真建窗口 + 派发点击/键入）；feature 只在 cargo test 时统一进来，
# 正常 cargo build 不受影响（test_support() 退化为恒等）
[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }
