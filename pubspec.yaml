name: daro
description: A lightweight desktop database management UI built with Flutter
publish_to: none
version: 0.8.1+13

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  base_ui_flutter:
    path: base-ui-flutter
  flutter:
    sdk: flutter
  # 多语言:提供 Material/Cupertino/Widgets 的本地化 delegate
  flutter_localizations:
    sdk: flutter
  # gen-l10n 运行期依赖。用 any 跟随 flutter_localizations 内部固定版本,避免冲突
  intl: any
  file_selector: ^1.0.3
  flutter_svg: ^2.0.10
  mysql_client: ^0.0.27
  postgres: ^3.5.12
  dart_odbc: ^6.2.1
  sqlite3: ^2.7.6
  path_provider: ^2.1.6
  provider: ^6.1.2
  # 用系统默认浏览器打开外部链接(帮助 → 问题反馈 → GitHub Issues)
  url_launcher: ^6.3.0
  # SQL 编辑器:语法高亮(re_highlight)+行号+补全框架(CodeAutocomplete),自绘实现零动画
  re_editor: ^0.10.0
  # re_editor 传递依赖,查询页直接引用其 langSql 语法规则,显式声明
  re_highlight: ^0.0.3
  window_manager: ^0.5.2
  # 锁定 0.5.42：0.6.0+ 是 EOL 占位包，不再捆绑 sqlite3.dll，勿升级
  sqlite3_flutter_libs: 0.5.42
  # Navicat 连接导入:解密导出文件里保存的连接密码(AES-128-CBC + PKCS#7)
  pointycastle: ^4.0.0
  # Navicat 连接导入:解析 .ncx(此前仅作为 flutter_svg 的传递依赖,现显式声明)
  xml: ^7.0.1
  desktop_multi_window: 0.3.1
  # 独立子窗口用 FFI 调 DwmSetWindowAttribute 染原生标题栏(此前仅为传递依赖)
  ffi: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # 测试里注入假 UrlLauncherPlatform,断言「问题反馈」请求打开的 URL
  url_launcher_platform_interface: ^2.3.2

flutter:
  # gen-l10n:生成 lib/l10n/app_localizations*.dart(见 l10n.yaml)
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    # 应用自绘图标集(矢量 SVG)
    - assets/icons/ui/
    - assets/icons/engines/
    # 项目主页双平台品牌图标(「关于」弹窗用,单文件声明不牵连 brands/ 其余素材)
    - assets/icons/brands/github.svg
    - assets/icons/brands/gitee.svg
    - windows/runner/resources/
